<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TAMAVA — Premium Noble Kava sourced directly from family estates across the South Pacific. Lab-tested, sustainably harvested, rooted in tradition." />
    <meta name="theme-color" content="#0D0F0A" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <title>TAMAVA — Premium Pacific Kava | Noble Certified</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detects forms at deploy time from static HTML. This hidden copy
         registers the React wholesale order form; keep its fields in sync with
         src/pages/Wholesale.tsx (one qty-<id> per product). -->
    <form name="wholesale-order" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="qty-root-powder-1kg" />
      <input name="qty-root-powder-varietal-1" />
      <input name="qty-instant-powder-varietal-2" />
      <input name="business" />
      <input name="contact" />
      <input name="email" />
      <input name="phone" />
      <textarea name="address"></textarea>
      <input name="delivery-date" />
      <textarea name="notes"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
